<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 64" role="img" aria-label="A2Z Power Corporate Services">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset=".55" stop-color="#F6B11A"/><stop offset="1" stop-color="#E8870B"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
<style>
.lt{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:d 1.1s cubic-bezier(.22,1,.36,1) forwards}
.z{animation-delay:.35s}
.b{fill:none;stroke:url(#g);stroke-width:4.8;stroke-linecap:round;stroke-dasharray:40;stroke-dashoffset:40;animation:d .5s cubic-bezier(.7,0,.3,1) .95s forwards}
.gl{opacity:0;animation:d .5s .95s forwards,f 1.1s ease-out 1.2s forwards,p 5s 2.3s infinite}
.rim{fill:none;stroke:url(#g);stroke-opacity:.45;stroke-dasharray:240;stroke-dashoffset:240;animation:d 1.6s cubic-bezier(.22,1,.36,1) .1s forwards}
.w{opacity:0;animation:w .9s cubic-bezier(.22,1,.36,1) .6s forwards}.s{animation-delay:.75s}
@keyframes d{to{stroke-dashoffset:0}}
@keyframes f{0%{opacity:0}15%{opacity:1}35%{opacity:.25}50%{opacity:.9}100%{opacity:.35}}
@keyframes p{0%,86%,100%{opacity:.35}89%{opacity:1}92%{opacity:.3}95%{opacity:.85}}
@keyframes w{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important;opacity:1!important}.gl{opacity:.35!important}}
</style></defs>
<rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="#0E1528"/><rect class="rim" x="1.5" y="1.5" width="61" height="61" rx="16"/>
<path class="lt" d="M9 50 L21.5 14 L34 50"/><path class="lt z" d="M37 14 H55 L38 50 H56"/>
<path class="b gl" filter="url(#glow)" d="M11.5 38.5 L22.5 32 L20.5 37.5 L32 31"/><path class="b" d="M11.5 38.5 L22.5 32 L20.5 37.5 L32 31"/>
<text class="w" x="80" y="34" font-family="Sora,Arial,sans-serif" font-weight="800" font-size="28" fill="#0B1020" letter-spacing="-.3">A<tspan fill="#E8870B">2</tspan>Z POWER</text>
<text class="w s" x="81" y="53" font-family="Sora,Arial,sans-serif" font-weight="600" font-size="10.5" fill="#525A6E" letter-spacing="3.6">CORPORATE SERVICES</text>
</svg>
